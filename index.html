<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Monitor important Reddit conversations by keyword, location, intent, and recommended action.">
<title>Karma Watch - Never miss a Reddit thread that matters</title>
<style>
  :root {
    --bg: #0b0e14; --bg2: #11151f; --card: #161b28; --border: #232a3b;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #ff4500; --accent2: #ff6a33;
    --green: #2dd4a7; --blue: #5b9dff; --yellow: #ffc555; --purple: #b78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
  a { color: var(--blue); text-decoration: none; }
  button.stat { color: inherit; font: inherit; text-align: left; }
  .drillbar-track, .drillbar-fill { display: block; }
  .demobar { background: var(--bg2); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; text-align: center; padding: 8px 16px; }
  .demobar b { color: var(--yellow); }
  button { cursor: pointer; font-family: inherit; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .btn:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 15px; }
  .btn-sm { padding: 5px 12px; font-size: 13px; border-radius: 6px; }
  input, select, textarea { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; font-family: inherit; }
  input:focus, select:focus, button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { font-size: 13px; color: var(--muted); display: block; margin: 12px 0 4px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .logo { font-weight: 800; font-size: 20px; color: var(--text); }
  .logo span { color: var(--accent); }
  .hero { text-align: center; padding: 80px 0 60px; }
  .hero h1 { font-size: 46px; line-height: 1.15; max-width: 760px; margin: 0 auto 20px; }
  .hero p { color: var(--muted); font-size: 19px; max-width: 620px; margin: 0 auto 32px; }
  .badge { display: inline-block; background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 4px 14px; border-radius: 999px; margin-bottom: 24px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 40px 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .card h3 { margin-bottom: 8px; font-size: 17px; }
  .card p { color: var(--muted); font-size: 14px; }
  .section { padding: 60px 0; }
  .section h2 { font-size: 32px; text-align: center; margin-bottom: 8px; }
  .section .sub { color: var(--muted); text-align: center; margin-bottom: 24px; }
  .price { font-size: 36px; font-weight: 800; margin: 10px 0; }
  .price small { font-size: 14px; color: var(--muted); font-weight: 400; }
  footer { border-top: 1px solid var(--border); padding: 30px 0; color: var(--muted); font-size: 13px; text-align: center; margin-top: 60px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.question { background: rgba(91,157,255,.15); color: var(--blue); }
  .tag.pain_point { background: rgba(255,197,85,.15); color: var(--yellow); }
  .tag.buying_signal { background: rgba(45,212,167,.15); color: var(--green); }
  .tag.comparison { background: rgba(183,139,250,.15); color: var(--purple); }
  .tag.informational, .tag.other, .tag.unclassified { background: rgba(139,147,167,.15); color: var(--muted); }
  /* app */
  .app { display: grid; grid-template-columns: 320px 1fr; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .statbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat b { font-size: 24px; display: block; }
  .stat span { font-size: 12px; color: var(--muted); }
  .thread { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .thread h4 { font-size: 15px; margin: 6px 0 4px; }
  .thread .meta { font-size: 12px; color: var(--muted); }
  .thread .body { font-size: 13px; color: var(--muted); margin: 6px 0; max-height: 60px; overflow: hidden; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters select { width: auto; }
  .mon { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg2); }
  .mon b { font-size: 14px; }
  .mon .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pill { display: inline-block; background: var(--card); border: 1px solid var(--border); font-size: 11px; padding: 1px 8px; border-radius: 999px; color: var(--muted); margin: 2px 2px 0 0; }
  .loc { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: rgba(91,157,255,.16); color: var(--blue); border: 1px solid rgba(91,157,255,.35); }
  .loc.unknown { background: rgba(139,147,167,.12); color: var(--muted); border-color: var(--border); }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin: 2px 2px 0 0; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); }
  .chip.commodity-electricity { color: var(--yellow); border-color: rgba(255,197,85,.4); }
  .chip.commodity-gas { color: var(--blue); border-color: rgba(91,157,255,.4); }
  .chip.commodity-both { color: var(--green); border-color: rgba(45,212,167,.4); }
  .chip.ci-complaint { color: var(--accent2); border-color: rgba(255,106,51,.5); }
  .chip.ci-billing { color: var(--yellow); border-color: rgba(255,197,85,.5); }
  .chip.ci-misinformation { color: var(--purple); border-color: rgba(183,139,250,.5); }
  .act { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .act.respond { background: rgba(45,212,167,.16); color: var(--green); }
  .act.escalate { background: rgba(255,106,51,.16); color: var(--accent2); }
  .act.seo_insight { background: rgba(183,139,250,.16); color: var(--purple); }
  .act.monitor { background: rgba(139,147,167,.14); color: var(--muted); }
  .authbox { max-width: 400px; margin: 80px auto; }
  .msg { font-size: 13px; margin-top: 10px; color: var(--yellow); }
  .msg.error { color: var(--accent2); }
  .msg.success { color: var(--green); }
  .hidden { display: none !important; }
  .stat { cursor: default; position: relative; }
  .stat.clickable { cursor: pointer; transition: border-color .15s, background .15s; }
  .stat.clickable:hover { border-color: var(--accent); background: var(--bg2); }
  .stat.active { border-color: var(--accent); background: rgba(255,69,0,.08); }
  .delta { font-size: 11px; font-weight: 700; margin-left: 6px; }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--accent2); }
  .delta.flat { color: var(--muted); }
  .periodbar { display: flex; gap: 6px; margin-bottom: 14px; }
  .periodbtn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .periodbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .drillbox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .drillbox h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
  .drillrow { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px; cursor: pointer; border: 0; border-radius: 6px; background: transparent; color: inherit; text-align: left; }
  .drillrow:hover { background: var(--bg2); }
  .drillrow.active { color: var(--accent2); font-weight: 700; }
  .drillbar-track { flex: 1; height: 6px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
  .drillbar-fill { height: 100%; background: var(--blue); border-radius: 999px; }
  .drillrow .drillcount { font-size: 12px; color: var(--muted); min-width: 18px; text-align: right; }
  .drillrow .drilllabel { font-size: 13px; min-width: 70px; }
  .drillbox .empty { font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; padding: 16px; } .hero { padding-top: 48px; } .hero h1 { font-size: 32px; } }
  @media (max-width: 560px) { .container { padding: 0 16px; } nav { align-items: flex-start; gap: 12px; } .periodbar { overflow-x: auto; padding-bottom: 4px; } .periodbtn { flex: 0 0 auto; } .filters select { width: 100%; } .thread { padding: 14px; } }
</style>
</head>
<body>
<main id="root"><div class="container"><p class="msg" role="status">Loading Karma Watch…</p></div></main>

<script type="module">
// Filled in by scripts/build-site.js. With no Supabase values the build is demo-only.
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_KEY = "__SUPABASE_PUBLISHABLE_KEY__";
const DEMO_DATA = null; /* build:demo-data */
/* build:demo-client */

const CONFIGURED = Boolean(SUPABASE_URL && SUPABASE_KEY);
const DEMO = !CONFIGURED || new URLSearchParams(location.search).has("demo");
const sb = DEMO
  ? createDemoClient(DEMO_DATA)
  : (await import("https://esm.sh/@supabase/supabase-js@2.111.0")).createClient(SUPABASE_URL, SUPABASE_KEY);
const demoBanner = DEMO ? `<div class="demobar" role="note"><b>Demo.</b> Every post, company, and number here is fictional. Changes reset when you reload.</div>` : "";

const root = document.getElementById("root");
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeToken = (value, fallback) => /^[a-z][a-z0-9_-]*$/i.test(String(value ?? "")) ? String(value) : fallback;
const formatDate = (value) => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "Date unavailable" : date.toLocaleString();
};
const threadTimestamp = (thread) => {
  const postedAt = thread.created_utc ? new Date(thread.created_utc).getTime() : NaN;
  if (Number.isFinite(postedAt)) return postedAt;
  const detectedAt = new Date(thread.detected_at).getTime();
  return Number.isFinite(detectedAt) ? detectedAt : 0;
};
const safeRedditUrl = (value) => {
  try {
    const url = new URL(String(value ?? ""));
    const host = url.hostname.toLowerCase();
    return url.protocol === "https:" && (host === "reddit.com" || host.endsWith(".reddit.com")) ? url.href : null;
  } catch { return null; }
};
const uniqueValues = (value, transform = (item) => item) => [...new Set(String(value ?? "").split(",").map((item) => transform(item.trim())).filter(Boolean))];
const showMessage = (selector, text, type = "error") => {
  const element = $(selector);
  if (!element) return;
  element.className = `msg ${type}`;
  element.textContent = text;
};
const tagLabel = { question: "Question", pain_point: "Pain Point", buying_signal: "Buying Signal", comparison: "Comparison", informational: "Informational", other: "Other", unclassified: "New" };
const ciLabel = { research: "Research", complaint: "Complaint", billing: "Billing issue", misinformation: "Misinformation", other: "Other" };
const actLabel = { respond: "Respond", monitor: "Monitor", escalate: "Escalate", seo_insight: "SEO insight" };
const commodityIcon = { electricity: "⚡ Electricity", gas: "🔥 Gas", both: "⚡🔥 Both", unknown: "Commodity n/a" };
const industryLabel = { energy: "⚡ Energy" };
const industryIcon = (ind) => {
  const value = String(ind || "energy").trim();
  return industryLabel[value] ?? ("🏷️ " + value[0].toUpperCase() + value.slice(1));
};

let session = null;
let monitors = [];
let threads = [];
let filters = { industry: "", intent: "", subreddit: "", monitor: "", state: "", commodity: "", action: "", ci: "", sort: "new", period: "all", geoOnly: false, priorityOnly: false };
function threadIndustry(t) {
  const mon = monitors.find((m) => m.id === t.monitor_id);
  return mon?.industry || "energy";
}

// ---------- PERIOD / DRILL-DOWN HELPERS ----------
const PERIOD_MS = { today: 24 * 60 * 60 * 1000, "7d": 7 * 24 * 60 * 60 * 1000, "30d": 30 * 24 * 60 * 60 * 1000, all: null };
const periodLabel = { today: "Today", "7d": "7 days", "30d": "30 days", all: "All time" };
function periodBounds(period) {
  if (period === "all") return { start: null, prevStart: null, prevEnd: null };
  const span = PERIOD_MS[period];
  const now = Date.now();
  const start = period === "today" ? new Date().setHours(0, 0, 0, 0) : now - span;
  return { start, prevStart: start - span, prevEnd: start };
}
function inPeriod(list, start) {
  if (start == null) return list;
  return list.filter((t) => threadTimestamp(t) >= start);
}
function countBy(list, field, labelMap) {
  const counts = new Map();
  for (const t of list) {
    const v = t[field];
    if (!v) continue;
    counts.set(v, (counts.get(v) ?? 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([value, count]) => ({ value, count, label: labelMap ? (labelMap[value] ?? value) : value }));
}
function drillList(items, max, activeValue, dataAttr) {
  if (items.length === 0) return `<p class="empty">No data yet for this period.</p>`;
  return items.map(({ value, count, label }) => `
    <button type="button" class="drillrow ${activeValue === value ? "active" : ""}" data-${dataAttr}="${esc(value)}" title="Filter the inbox to ${esc(label)}" aria-pressed="${activeValue === value}">
      <span class="drilllabel">${esc(label)}</span>
      <span class="drillbar-track"><span class="drillbar-fill" style="width:${Math.round((count / max) * 100)}%"></span></span>
      <span class="drillcount">${count}</span>
    </button>`).join("");
}

// ---------- LANDING ----------
function renderLanding() {
  root.innerHTML = `
  ${demoBanner}
  <div class="container">
    <nav>
      <div class="logo">Karma<span>Watch</span></div>
      <div class="row">
        ${DEMO ? `<button class="btn btn-sm" onclick="location.hash='#/app'">Open the demo</button>` : `<button class="btn-ghost btn-sm" onclick="location.hash='#/login'">Sign in</button>
        <button class="btn btn-sm" onclick="location.hash='#/signup'">Get started</button>`}
      </div>
    </nav>
    <div class="hero">
      <div class="badge">Reddit Presence &middot; Keyword Monitoring</div>
      <h1>Never miss a Reddit thread that mentions what you sell</h1>
      <p>Set up monitors for your brand, product and industry keywords across the subreddits that matter. Karma Watch scans on a schedule and classifies every thread by <b>location</b>, commodity, customer intent and recommended action — so only conversations worth joining reach you.</p>
      <p style="max-width:640px;margin:0 auto 28px;font-style:italic;color:var(--blue)">"Reddit discovery should follow the customer's geography and lived problem, not just the company's product category."</p>
      <div class="row" style="justify-content:center">
        ${DEMO ? `<button class="btn" onclick="location.hash='#/app'">Open the demo</button>` : `<button class="btn" onclick="location.hash='#/signup'">Start monitoring</button>
        <button class="btn-ghost" onclick="location.hash='#/login'">Sign in</button>`}
      </div>
    </div>
    <div class="grid3">
      <div class="card"><h3>🎯 Keyword monitors</h3><p>Track exact brand, product and campaign terms across the subreddits you choose. Every match is deduped before it reaches your inbox.</p></div>
      <div class="card"><h3>🌊 Industry monitors</h3><p>Track broader topics so you surface high-intent discussions even when nobody names you — perfect for finding new conversations to join.</p></div>
      <div class="card"><h3>⚔️ Competitor monitors</h3><p>Watch rival brands to catch comparison threads, complaints and switching intent — and step in with a better answer.</p></div>
    </div>
    <div class="section">
      <h2>Built for action, not just listening</h2>
      <p class="sub">Scheduled scan → intent classification → filterable inbox</p>
      <div class="grid3">
        <div class="card"><h3>AI intent classification</h3><p>AI tags each thread, with rule-based fallbacks: <span class="tag question">Question</span> <span class="tag pain_point">Pain Point</span> <span class="tag buying_signal">Buying Signal</span></p></div>
        <div class="card"><h3>Powerful filtering</h3><p>Slice your inbox by intent, subreddit, monitor and upvotes. Sort by newest or top to triage the highest-impact threads first.</p></div>
        <div class="card"><h3>Scheduled scanning</h3><p>Designed to check all your active monitors every 15 minutes and add new matches to your inbox.</p></div>
      </div>
    </div>
    <footer>© ${new Date().getFullYear()} Karma Watch · Not affiliated with Reddit, Inc.</footer>
  </div>`;
}

// ---------- AUTH ----------
function renderAuth(mode) {
  root.innerHTML = `
  <div class="container">
    <nav><a class="logo" href="#">Karma<span>Watch</span></a></nav>
    <div class="authbox card">
      <h3 style="margin-bottom:12px">${mode === "signup" ? "Create your account" : "Welcome back"}</h3>
      <form id="authForm">
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="${mode === "signup" ? "new-password" : "current-password"}" minlength="6" placeholder="••••••••" required />
        <br><br>
        <button class="btn" style="width:100%" id="authBtn" type="submit">${mode === "signup" ? "Sign up" : "Sign in"}</button>
      </form>
      <div class="msg" id="authMsg" role="status" aria-live="polite"></div>
      <p style="margin-top:14px;font-size:13px;color:var(--muted)">
        ${mode === "signup" ? `Already have an account? <a href="#/login">Sign in</a>` : `No account? <a href="#/signup">Sign up</a>`}
      </p>
    </div>
  </div>`;
  $("#authForm").onsubmit = async (event) => {
    event.preventDefault();
    const email = $("#email").value.trim(), password = $("#pw").value;
    const button = $("#authBtn");
    const message = $("#authMsg");
    button.disabled = true;
    message.className = "msg";
    message.textContent = "Working…";
    try {
      const request = mode === "signup" ? sb.auth.signUp({ email, password }) : sb.auth.signInWithPassword({ email, password });
      const { data, error } = await request;
      if (error) throw error;
      if (mode === "signup" && !data.session) {
        message.className = "msg success";
        message.textContent = "Check your email to confirm your account, then sign in.";
        return;
      }
      location.hash = "#/app";
    } catch (error) {
      message.className = "msg error";
      message.textContent = error.message || "Authentication failed. Please try again.";
    } finally {
      button.disabled = false;
    }
  };
}

// ---------- APP ----------
async function loadData() {
  const [m, t] = await Promise.all([
    sb.from("monitors").select("*").order("created_at"),
    sb.from("threads").select("*").order("created_utc", { ascending: false, nullsFirst: false }).limit(500),
  ]);
  if (m.error) throw new Error(`Could not load monitors: ${m.error.message}`);
  if (t.error) throw new Error(`Could not load threads: ${t.error.message}`);
  monitors = m.data ?? [];
  threads = t.data ?? [];
}

function threadCard(t) {
  const mon = monitors.find((m) => m.id === t.monitor_id);
  const loc = t.geo_location && t.geo_location !== "Unknown";
  const action = safeToken(t.recommended_action, "monitor");
  const intent = tagLabel[t.intent] ? t.intent : "unclassified";
  const status = safeToken(t.status, "new");
  const customerIntent = ciLabel[t.customer_intent] ? t.customer_intent : null;
  const commodity = commodityIcon[t.commodity] ? t.commodity : null;
  const href = safeRedditUrl(t.url);
  const hasPostedDate = Boolean(t.created_utc) && Number.isFinite(new Date(t.created_utc).getTime());
  const displayedDate = hasPostedDate ? t.created_utc : t.detected_at;
  return `<div class="thread">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="loc ${loc ? "" : "unknown"}">📍 ${esc(loc ? t.geo_location : "Location unknown")}</span>
        ${t.recommended_action ? `<span class="act ${action}">${actLabel[action] ?? action}</span>` : ""}
      </div>
      <span class="meta" title="Detected ${esc(formatDate(t.detected_at))}">${hasPostedDate ? "Posted" : "Found"} ${esc(formatDate(displayedDate))}</span>
    </div>
    <h4>${esc(t.title || "Untitled thread")}</h4>
    ${t.body ? `<div class="body">${esc(t.body)}</div>` : ""}
    <div class="row" style="margin:6px 0">
      <span class="tag ${intent}">${tagLabel[intent]}</span>
      ${customerIntent ? `<span class="chip ci-${customerIntent}">${ciLabel[customerIntent]}</span>` : ""}
      ${commodity ? `<span class="chip commodity-${commodity}">${commodityIcon[commodity]}</span>` : ""}
      ${t.energy_market && t.energy_market !== "Unknown" ? `<span class="chip">${esc(t.energy_market)}</span>` : ""}
      ${t.brand_tolerance ? `<span class="chip" title="Subreddit tolerance for brand participation">brand: ${esc(t.brand_tolerance)}</span>` : ""}
    </div>
    <div class="row">
      <span class="meta">r/${esc(t.subreddit || "unknown")} · ▲ ${Number(t.upvotes) || 0} · 💬 ${Number(t.num_comments) || 0}${mon ? " · " + esc(mon.name) : ""}</span>
    </div>
    <div class="row" style="margin-top:8px">
      ${href ? `<a class="btn-ghost btn-sm" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Open on Reddit ↗</a>` : DEMO ? `<button class="btn-ghost btn-sm" disabled title="Sample posts are fictional, so there is no thread to open">Open on Reddit ↗</button>` : ""}
      ${status === "new" ? `<button class="btn-ghost btn-sm" data-read="${esc(t.id)}">Mark read</button>` : `<span class="pill">${esc(status)}</span>`}
      <button class="btn-ghost btn-sm" data-dismiss="${esc(t.id)}">Dismiss</button>
    </div>
  </div>`;
}

const NON_US_HARD = ["UK", "GB", "EU", "Other"]; // always out of scope, regardless of industry
// Canada is only out-of-scope for the US-focused energy vertical — other
// industries may legitimately want Canadian threads, so this exclusion is
// scoped per-thread industry.
function isOutOfScope(t) {
  const country = String(t.country || "").trim();
  if (NON_US_HARD.includes(country)) return true;
  if (country === "CA" || country === "Canada") return threadIndustry(t) === "energy";
  return false;
}
function applyFilters(list) {
  let out = list.filter((t) => t.status !== "dismissed" && !isOutOfScope(t));
  if (filters.industry) out = out.filter((t) => threadIndustry(t) === filters.industry);
  const { start } = periodBounds(filters.period);
  out = inPeriod(out, start);
  if (filters.geoOnly) out = out.filter((t) => t.us_state);
  if (filters.priorityOnly) out = out.filter((t) => t.recommended_action === "respond" || t.recommended_action === "escalate");
  if (filters.intent) out = out.filter((t) => (tagLabel[t.intent] ? t.intent : "unclassified") === filters.intent);
  if (filters.subreddit) out = out.filter((t) => t.subreddit === filters.subreddit);
  if (filters.monitor) out = out.filter((t) => t.monitor_id === filters.monitor);
  if (filters.state) out = out.filter((t) => (t.us_state || "") === filters.state);
  if (filters.commodity) out = out.filter((t) => (t.commodity || "") === filters.commodity);
  if (filters.action) out = out.filter((t) => (t.recommended_action || "") === filters.action);
  if (filters.ci) out = out.filter((t) => (t.customer_intent || "") === filters.ci);
  if (filters.sort === "top") out = [...out].sort((a, b) => (Number(b.upvotes) || 0) - (Number(a.upvotes) || 0));
  else out = [...out].sort((a, b) => threadTimestamp(b) - threadTimestamp(a));
  return out;
}

function renderApp() {
  const industries = [...new Set(monitors.map((m) => m.industry || "energy"))];
  const industryScoped = filters.industry ? threads.filter((t) => threadIndustry(t) === filters.industry) : threads;
  const subs = [...new Set(industryScoped.map((t) => t.subreddit))];
  const states = [...new Set(industryScoped.map((t) => t.us_state).filter(Boolean))].sort();
  const visible = applyFilters(threads);
  // Energy-specific breakdowns (US state, electricity/gas) only make sense when
  // looking at the energy vertical (or "All" with no other industry mixed in yet).
  const showEnergyBreakdowns = filters.industry ? filters.industry === "energy" : !industries.some((i) => i !== "energy");

  // Period-scoped base (US-only, not dismissed) — drives the stat bar & drill-downs
  // independently of the inbox's own filters, so you always see the full breakdown
  // to click into, then the inbox below reflects everything combined.
  const baseList = threads.filter((t) => t.status !== "dismissed" && !isOutOfScope(t)).filter((t) => !filters.industry || threadIndustry(t) === filters.industry);
  const { start: curStart, prevStart, prevEnd } = periodBounds(filters.period);
  const periodList = inPeriod(baseList, curStart);
  const prevList = filters.period === "all" ? [] : baseList.filter((t) => { const ts = threadTimestamp(t); return ts >= prevStart && ts < prevEnd; });
  const delta = filters.period === "all" ? null : periodList.length - prevList.length;
  const deltaHtml = delta == null ? "" : delta === 0 ? `<span class="delta flat">flat</span>` : delta > 0 ? `<span class="delta up">▲ ${delta} vs prior ${periodLabel[filters.period].toLowerCase()}</span>` : `<span class="delta down">▼ ${Math.abs(delta)} vs prior ${periodLabel[filters.period].toLowerCase()}</span>`;

  const located = periodList.filter((t) => t.us_state).length;
  const toRespond = periodList.filter((t) => t.recommended_action === "respond" || t.recommended_action === "escalate").length;

  const actionBreakdown = countBy(periodList.filter((t) => t.recommended_action), "recommended_action", actLabel);
  const actionMax = Math.max(1, ...actionBreakdown.map((s) => s.count));

  const leftBreakdown = showEnergyBreakdowns ? countBy(periodList, "us_state") : countBy(periodList, "subreddit");
  const leftMax = Math.max(1, ...leftBreakdown.map((s) => s.count));
  const rightBreakdown = showEnergyBreakdowns
    ? countBy(periodList.filter((t) => t.commodity && t.commodity !== "unknown"), "commodity", commodityIcon)
    : countBy(periodList.filter((t) => t.customer_intent), "customer_intent", ciLabel);
  const rightMax = Math.max(1, ...rightBreakdown.map((s) => s.count));
  const leftFilterKey = showEnergyBreakdowns ? "state" : "subreddit";
  const rightFilterKey = showEnergyBreakdowns ? "commodity" : "ci";

  root.innerHTML = `
  ${demoBanner}
  <div class="container" style="max-width:1400px">
    <nav>
      <div class="logo">Karma<span>Watch</span></div>
      <div class="row">
        <span class="meta" style="color:var(--muted);font-size:13px">${esc(session?.user?.email || "Signed in")}</span>
        <button class="btn-ghost btn-sm" id="logout">${DEMO ? "Exit demo" : "Sign out"}</button>
      </div>
    </nav>
  </div>
  <div class="app">
    <div class="side">
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h3>Monitors</h3>
          <button class="btn btn-sm" id="scanNow">Scan now</button>
        </div>
        <div id="monList">
          ${monitors.map((m) => `
            <div class="mon">
              <div class="row" style="justify-content:space-between">
                <b>${esc(m.name)}</b>
                <span class="row" style="gap:4px"><span class="pill">${esc(industryIcon(m.industry || "energy"))}</span><span class="pill">${esc(m.type || "keyword")}</span></span>
              </div>
              <div class="meta">${(m.keywords ?? []).map((k) => `<span class="pill">${esc(k)}</span>`).join("")}</div>
              <div class="meta">${(m.subreddits ?? []).map((s) => `<span class="pill">r/${esc(s)}</span>`).join("")}</div>
              <div class="row" style="margin-top:8px">
                <button class="btn-ghost btn-sm" data-del="${esc(m.id)}" data-name="${esc(m.name)}">Delete</button>
                <span class="meta">${m.last_scanned_at ? "scanned " + esc(formatDate(m.last_scanned_at)) : "not scanned yet"}</span>
              </div>
            </div>`).join("") || `<p style="font-size:13px;color:var(--muted)">No monitors yet — create your first below.</p>`}
        </div>
      </div>
      <div class="card">
        <h3>New monitor</h3>
        <form id="monitorForm">
          <label for="mName">Name</label><input id="mName" maxlength="100" placeholder="My brand" required />
          <label for="mIndustry">Industry / client</label>
          <select id="mIndustry">${industries.map((i) => `<option value="${esc(i)}">${esc(industryIcon(i))}</option>`).join("")}<option value="__new__">+ New industry…</option></select>
          <input id="mIndustryNew" maxlength="60" aria-label="New industry name" placeholder="e.g. software" style="display:none;margin-top:6px" />
          <label for="mType">Type</label>
          <select id="mType"><option value="keyword">Keyword (exact terms)</option><option value="industry">Industry (broad topic)</option><option value="competitor">Competitor</option></select>
          <label for="mKeywords">Keywords (comma-separated)</label><input id="mKeywords" placeholder="brandname, product name" required />
          <label for="mSubs">Subreddits (comma-separated, no r/)</label><input id="mSubs" placeholder="startups, SaaS" required />
          <label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" id="mAlerts" style="width:auto" /> Email alerts (beta)</label>
          <br><button class="btn" style="width:100%" id="mCreate" type="submit">Create monitor</button>
        </form>
        <div class="msg" id="mMsg" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div>
      ${industries.length > 1 ? `<div class="periodbar" style="margin-bottom:8px">
        <button class="periodbtn ${filters.industry === "" ? "active" : ""}" data-industry="">All industries</button>
        ${industries.map((i) => `<button class="periodbtn ${filters.industry === i ? "active" : ""}" data-industry="${esc(i)}">${esc(industryIcon(i))}</button>`).join("")}
      </div>` : ""}
      <div class="periodbar">
        ${Object.entries(periodLabel).map(([k, v]) => `<button class="periodbtn ${filters.period === k ? "active" : ""}" data-period="${k}">${v}</button>`).join("")}
      </div>
      <div class="statbar">
        <div class="stat" title="Threads posted in the selected period${filters.industry ? " for " + esc(industryIcon(filters.industry)) : ", across all your monitors"}"><b>${periodList.length}</b><span>threads${deltaHtml}</span></div>
        <div class="stat" title="${showEnergyBreakdowns ? "Distinct US states detected among this period's threads" : "Distinct subreddits this period's threads came from"}"><b>${new Set(periodList.map((t) => showEnergyBreakdowns ? t.us_state : t.subreddit).filter(Boolean)).size}</b><span>${showEnergyBreakdowns ? "locations detected" : "subreddits active"}</span></div>
        <button type="button" class="stat clickable ${filters.geoOnly ? "active" : ""}" id="statGeo" aria-pressed="${filters.geoOnly}" title="Threads where we could infer a specific US state or market. Click to show only these."><b>${located}</b><span>geo-tagged threads</span></button>
        <button type="button" class="stat clickable ${filters.priorityOnly ? "active" : ""}" id="statPriority" aria-pressed="${filters.priorityOnly}" title="Threads AI flagged as worth a reply now (respond) or needing escalation (billing/complaint). Click to show only these."><b>${toRespond}</b><span>respond / escalate</span></button>
      </div>
      <div class="insights">
        <div class="drillbox">
          <h4 title="${showEnergyBreakdowns ? "Where this period's threads are coming from, by US state" : "Which subreddits this period's threads are coming from"}">${showEnergyBreakdowns ? "By location" : "By subreddit"}</h4>
          ${drillList(leftBreakdown, leftMax, filters[leftFilterKey], "drillleft")}
        </div>
        <div class="drillbox">
          <h4 title="What we recommend doing with this period's threads">By recommended action</h4>
          ${drillList(actionBreakdown, actionMax, filters.action, "drillaction")}
        </div>
        <div class="drillbox">
          <h4 title="${showEnergyBreakdowns ? "Electricity vs. gas vs. both, for threads where the commodity was inferable" : "Why the customer appears to be posting"}">${showEnergyBreakdowns ? "By commodity" : "By customer intent"}</h4>
          ${drillList(rightBreakdown, rightMax, filters[rightFilterKey], "drillright")}
        </div>
      </div>
      <div class="filters">
        <select id="fState" aria-label="Location" title="Filter to a specific US state or market"><option value="">All locations</option>${states.map((s) => `<option value="${esc(s)}" ${filters.state === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <select id="fCommodity" aria-label="Commodity" title="Filter by electricity, gas, or both"><option value="">All commodities</option>${["electricity","gas","both","unknown"].map((c) => `<option value="${c}" ${filters.commodity === c ? "selected" : ""}>${commodityIcon[c]}</option>`).join("")}</select>
        <select id="fAction" aria-label="Recommended action" title="Filter by what the AI recommends doing with this thread"><option value="">All actions</option>${Object.entries(actLabel).map(([k, v]) => `<option value="${k}" ${filters.action === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <select id="fCi" aria-label="Customer intent" title="Filter by why the customer appears to be posting"><option value="">All customer intents</option>${Object.entries(ciLabel).map(([k, v]) => `<option value="${k}" ${filters.ci === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <select id="fIntent" aria-label="Engagement intent"><option value="">All engagement</option>${Object.entries(tagLabel).map(([k, v]) => `<option value="${k}" ${filters.intent === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <select id="fSub" aria-label="Subreddit"><option value="">All subreddits</option>${subs.map((s) => `<option value="${esc(s)}" ${filters.subreddit === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
        <select id="fMon" aria-label="Monitor"><option value="">All monitors</option>${monitors.filter((m) => !filters.industry || (m.industry || "energy") === filters.industry).map((m) => `<option value="${esc(m.id)}" ${filters.monitor === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
        <select id="fSort" aria-label="Sort threads"><option value="new" ${filters.sort === "new" ? "selected" : ""}>Newest posted</option><option value="top" ${filters.sort === "top" ? "selected" : ""}>Top upvotes</option></select>
      </div>
      <div class="msg" id="appMsg" role="status" aria-live="polite"></div>
      <div id="inbox">
        ${visible.map(threadCard).join("") || `<div class="card"><p>${threads.length ? "No threads match the current filters." : "No threads yet. Create a monitor and run a scan."}</p>${threads.length ? `<br><button class="btn-ghost btn-sm" id="clearFilters">Clear filters</button>` : ""}</div>`}
      </div>
    </div>
  </div>`;

  $("#logout").onclick = async () => {
    const { error } = await sb.auth.signOut();
    if (error) { showMessage("#appMsg", error.message); return; }
    location.hash = "";
  };
  $("#fState").onchange = (e) => { filters.state = e.target.value; renderApp(); };
  $("#fCommodity").onchange = (e) => { filters.commodity = e.target.value; renderApp(); };
  $("#fAction").onchange = (e) => { filters.action = e.target.value; renderApp(); };
  $("#fCi").onchange = (e) => { filters.ci = e.target.value; renderApp(); };
  $("#fIntent").onchange = (e) => { filters.intent = e.target.value; renderApp(); };
  $("#fSub").onchange = (e) => { filters.subreddit = e.target.value; renderApp(); };
  $("#fMon").onchange = (e) => { filters.monitor = e.target.value; renderApp(); };
  $("#fSort").onchange = (e) => { filters.sort = e.target.value; renderApp(); };
  if ($("#clearFilters")) $("#clearFilters").onclick = () => {
    filters = { industry: filters.industry, intent: "", subreddit: "", monitor: "", state: "", commodity: "", action: "", ci: "", sort: "new", period: "all", geoOnly: false, priorityOnly: false };
    renderApp();
  };

  document.querySelectorAll("[data-period]").forEach((b) => b.onclick = () => { filters.period = b.dataset.period; renderApp(); });
  document.querySelectorAll("[data-industry]").forEach((b) => b.onclick = () => {
    filters.industry = b.dataset.industry;
    filters.state = ""; filters.commodity = ""; filters.subreddit = ""; filters.ci = ""; filters.monitor = "";
    renderApp();
  });
  $("#statGeo").onclick = () => { filters.geoOnly = !filters.geoOnly; renderApp(); };
  $("#statPriority").onclick = () => { filters.priorityOnly = !filters.priorityOnly; renderApp(); };
  document.querySelectorAll("[data-drillleft]").forEach((el) => el.onclick = () => { filters[leftFilterKey] = filters[leftFilterKey] === el.dataset.drillleft ? "" : el.dataset.drillleft; renderApp(); });
  document.querySelectorAll("[data-drillaction]").forEach((el) => el.onclick = () => { filters.action = filters.action === el.dataset.drillaction ? "" : el.dataset.drillaction; renderApp(); });
  document.querySelectorAll("[data-drillright]").forEach((el) => el.onclick = () => { filters[rightFilterKey] = filters[rightFilterKey] === el.dataset.drillright ? "" : el.dataset.drillright; renderApp(); });

  $("#mIndustry").onchange = (e) => {
    const isNew = e.target.value === "__new__";
    $("#mIndustryNew").style.display = isNew ? "block" : "none";
    $("#mIndustryNew").required = isNew;
    if (isNew) $("#mIndustryNew").focus();
  };
  $("#monitorForm").onsubmit = async (event) => {
    event.preventDefault();
    const name = $("#mName").value.trim();
    const keywords = uniqueValues($("#mKeywords").value);
    const subreddits = uniqueValues($("#mSubs").value, (value) => value.replace(/^\/?r\//i, "").replace(/^\/+|\/+$/g, "").toLowerCase());
    const industrySel = $("#mIndustry").value;
    const industry = (industrySel === "__new__" ? $("#mIndustryNew").value.trim() : industrySel) || "energy";
    if (!name || keywords.length === 0 || subreddits.length === 0) { showMessage("#mMsg", "Name, keywords and subreddits are required."); return; }
    if (subreddits.some((subreddit) => !/^[a-z0-9_]{2,21}$/i.test(subreddit))) { showMessage("#mMsg", "Use valid subreddit names without spaces or r/ prefixes."); return; }
    const button = $("#mCreate");
    button.disabled = true;
    button.textContent = "Creating…";
    try {
      const { error } = await sb.from("monitors").insert({ user_id: session.user.id, name, type: $("#mType").value, keywords, subreddits, industry, email_alerts: $("#mAlerts").checked });
      if (error) throw error;
      await loadData();
      renderApp();
      showMessage("#appMsg", `Created monitor “${name}”.`, "success");
    } catch (error) {
      button.disabled = false;
      button.textContent = "Create monitor";
      showMessage("#mMsg", error.message || "Could not create the monitor.");
    }
  };

  document.querySelectorAll("[data-del]").forEach((button) => button.onclick = async () => {
    if (!window.confirm(`Delete “${button.dataset.name || "this monitor"}”? This cannot be undone.`)) return;
    button.disabled = true;
    const { error } = await sb.from("monitors").delete().eq("id", button.dataset.del);
    if (error) { button.disabled = false; showMessage("#appMsg", error.message); return; }
    try { await loadData(); renderApp(); } catch (refreshError) { button.disabled = false; showMessage("#appMsg", refreshError.message); }
  });
  document.querySelectorAll("[data-read]").forEach((button) => button.onclick = async () => {
    button.disabled = true;
    const { error } = await sb.from("threads").update({ status: "read" }).eq("id", button.dataset.read);
    if (error) { button.disabled = false; showMessage("#appMsg", error.message); return; }
    try { await loadData(); renderApp(); } catch (refreshError) { button.disabled = false; showMessage("#appMsg", refreshError.message); }
  });
  document.querySelectorAll("[data-dismiss]").forEach((button) => button.onclick = async () => {
    button.disabled = true;
    const { error } = await sb.from("threads").update({ status: "dismissed" }).eq("id", button.dataset.dismiss);
    if (error) { button.disabled = false; showMessage("#appMsg", error.message); return; }
    try { await loadData(); renderApp(); } catch (refreshError) { button.disabled = false; showMessage("#appMsg", refreshError.message); }
  });

  $("#scanNow").onclick = async () => {
    $("#scanNow").textContent = "Scanning…"; $("#scanNow").disabled = true;
    const scanController = new AbortController();
    const scanTimeout = window.setTimeout(() => scanController.abort(), 60_000);
    try {
      if (DEMO) {
        const message = await sb.demoScan();
        await loadData();
        renderApp();
        showMessage("#appMsg", message, "success");
        return;
      }
      const res = await fetch(`${SUPABASE_URL}/functions/v1/scan-reddit`, {
        method: "POST",
        headers: { Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({}),
        signal: scanController.signal,
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.error || `Scan failed with HTTP ${res.status}`);
      await loadData();
      renderApp();
      showMessage("#appMsg", payload.message || "Scan finished.", "success");
    } catch (error) {
      await loadData().catch(() => {});
      renderApp();
      showMessage("#appMsg", error.name === "AbortError" ? "The scan timed out after 60 seconds." : (error.message || "The scan could not be started."));
    } finally {
      window.clearTimeout(scanTimeout);
    }
  };
}

// ---------- ROUTER ----------
async function route() {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    session = data.session;
    const h = location.hash;
    if (h.startsWith("#/app")) {
      if (!session) { location.hash = "#/login"; return; }
      await loadData(); renderApp();
    } else if (DEMO && (h.startsWith("#/login") || h.startsWith("#/signup"))) location.hash = "#/app";
    else if (h.startsWith("#/login")) renderAuth("login");
    else if (h.startsWith("#/signup")) renderAuth("signup");
    else renderLanding();
  } catch (error) {
    root.innerHTML = `<div class="container"><div class="authbox card"><h3>Karma Watch could not load</h3><p class="msg error">${esc(error.message || "Please check your connection and try again.")}</p><br><button class="btn" id="retryRoute">Try again</button></div></div>`;
    $("#retryRoute").onclick = route;
  }
}
window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange((event, nextSession) => {
  session = nextSession;
  if (event === "SIGNED_OUT" && location.hash.startsWith("#/app")) location.hash = "#/login";
  if (event === "SIGNED_IN" && (location.hash.startsWith("#/login") || location.hash.startsWith("#/signup"))) location.hash = "#/app";
});
route();
</script>
